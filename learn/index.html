<style>
/* VOICE: playful, encouraging coach; learn by doing, led by your life
   IDEA: two doors, At work and In my life, then your role or area, then a real task done step by step with AI
   PICTURE: two big door tiles and a big "what do you want to do" search; sticker-style task cards
   COLOUR and TYPE: paper white, ink outlines, a colour per role or area; Geist + Inter
   LAYOUT: home (search + doors + popular) > door (roles/areas) > area (tasks) > task (step-by-step) */

:root{color-scheme:light;--bg:#FFFFFF;--card:#fff;--ink:#17201C;--ink2:#4b4f58;--ink3:#5f6570;--line:#DDE4DF;
--l1:#CDEBD9;--l2:#D3E3EC;--l3:#F1D9CF;--l4:#D9E8C9;--y:#CDEBD9;--ok:#0f8a5f;--r:6px}
*{box-sizing:border-box;min-width:0}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:var(--fs-base)/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:Newsreader,Georgia,serif,system-ui,sans-serif;letter-spacing:-.03em;margin:0}
a{color:inherit}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #0E5A43;outline-offset:2px;border-radius:8px}
svg{width:22px;height:22px;flex:none}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;height:66px;padding:0 max(20px,calc((100vw - 1160px)/2));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 var(--fs-base) Newsreader,Inter;letter-spacing:-.02em}
.mark{width:34px;height:34px;border-radius:6px;background:var(--ink);color:var(--y);display:grid;place-items:center;font:900 var(--fs-xs) Inter;transform:rotate(-6deg)}
.logo small{font:600 var(--fs-xs) Inter;color:var(--ink3);margin-left:4px}
.xpb{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:var(--fs-xs);color:var(--ink2);background:var(--card);border:1px solid var(--edge);border-radius:30px;padding:5px 14px;box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4)}
.xpb b{font:800 var(--fs-sm) Newsreader,Inter;color:var(--ink)}.xpb .st{width:20px;height:20px;border-radius:50%;background:var(--y);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:900}
.xpb.pop{animation:pop .5s}@keyframes pop{40%{transform:scale(1.15)}}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
#app{max-width:1160px;margin:0 auto;padding:0 20px 60px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:1px solid var(--edge);border-radius:6px;background:var(--card);font-weight:700;font-size:var(--fs-sm);text-decoration:none;box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4)}
.btn.pri{background:var(--y)}.btn.big{min-height:58px;padding:0 28px;font-size:var(--fs-base);border-radius:6px}.btn span{transition:transform .15s}.btn:hover span{transform:translateX(3px)}
.btn:disabled{opacity:.5;cursor:default}.btn.glow{animation:glow 1.2s infinite}@keyframes glow{50%{box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4),0 0 0 6px rgba(205,235,217,.6)}}
.lnk{background:none;border:0;padding:6px 4px;font-weight:600;color:var(--ink2);display:inline-flex;gap:6px;align-items:center;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}.lnk:hover{color:var(--ink);text-decoration-color:var(--ink)}.lnk svg{width:18px;height:18px}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding:56px 0 40px}
.kick2{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:var(--fs-xs);background:var(--card);border:1px solid var(--edge);border-radius:30px;padding:5px 14px}.kick2 i{width:9px;height:9px;border-radius:50%;background:#22c55e}
.hero h1{font-size:var(--fs-display);line-height:1.15;margin:20px 0 18px;text-wrap:balance}
.hl1{background:var(--y);padding:0 .15em;border-radius:6px;display:inline-block;transform:rotate(-2deg)}
.hero p{font-size:var(--fs-md);color:var(--ink2);max-width:52ch;margin:0 0 28px}
.duo{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:30px}
.duo>div{background:var(--card);border:1px solid var(--edge);border-radius:6px;padding:8px 14px;line-height:1.25}.duo b{display:block;font:800 var(--fs-base) Newsreader,Inter}.duo span{font-size:var(--fs-xs);color:var(--ink3)}
.duo .ai{background:var(--ink);color:#fff}.duo .ai span{color:#b8bcc6}.duo .res2{background:var(--y)}.duo .res2 span{color:#0A4031}.plus{font:800 var(--fs-md) Newsreader,Inter;color:var(--ink3)}
.stack{position:relative;height:400px}
.sc{position:absolute;background:var(--card);border:1px solid var(--edge);border-radius:6px;padding:16px;box-shadow:0 1px 0 rgba(15,42,34,.05),0 10px 22px -18px rgba(15,42,34,.4);width:88%}
.s1{top:0;left:0;transform:rotate(-4deg);opacity:.9}.s2{top:120px;right:0;transform:rotate(2deg)}.s3{bottom:0;left:8%;width:auto;display:flex;align-items:center;gap:14px;background:var(--y);transform:rotate(-3deg)}
.bub{font-size:var(--fs-xs);border-radius:6px;padding:8px 12px;margin-bottom:8px;line-height:1.45}.bub.you{background:#EEF2EF;margin-left:16%}.bub.ai{background:var(--ink);color:#fff;margin-right:12%}

<h1>Stop learning AI. Start doing with it. Free AI tasks and prompts by Kunal Mukherjee</h1>
<p>Learn by doing is free, hands-on AI practice by Kunal Mukherjee. Instead of watching lessons, you pick a real task from your work or your life and do it with any AI assistant, step by step. It has three parts: 45 guided tasks, Prompt Guru for everyday prompts, and Prompt Master, a 20-step prompt course.</p>
<h2>At work</h2><p>Pick your role. Learn AI on the work you actually do.</p>
<h3>Marketing</h3><p>Briefs, videos, posts and positioning</p><ul><li>Create your first e-commerce product video (30 to 45 min): Turn one product photograph into a polished 10 to 15-second product ad, even if you have never edited a video.</li><li>Turn one product photo into 5 social posts (20 min): Get a week of on-brand posts from a single product photo: captions, formats and visuals.</li><li>Write a campaign brief in 10 minutes (10 min): Turn a vague idea into a one-page campaign brief your team or agency can act on.</li><li>Research your competitors (15 min): Compare competitors on positioning, pricing and messaging, and find the gap you can own.</li><li>Write product descriptions that sell (10 min): Write clear, search-friendly product descriptions for your website or marketplace.</li></ul>
<h3>Sales</h3><p>Outreach, calls, proposals and follow-ups</p><ul><li>Write a cold email that gets replies (10 min): Write a short, personal outreach email people actually reply to.</li><li>Prepare for a sales call (15 min): Walk into any sales call with sharp questions and answers to likely objections.</li><li>Write a proposal summary (15 min): Turn messy deal notes into a crisp one-page proposal summary.</li></ul>
<h3>HR and people</h3><p>Hiring, onboarding and tough conversations</p><ul><li>Write an inclusive job description (10 min): Write a clear, inclusive job description that attracts the right people.</li><li>Plan a new joiner&#x27;s first week (10 min): Give every new joiner a welcoming, well-organised first week.</li><li>Prepare a difficult conversation (10 min): Plan what to say in a tough conversation: feedback, a no, or bad news.</li></ul>
<h3>Finance and accounts</h3><p>Formulas, expenses and reminders</p><ul><li>Get any Excel formula explained (5 min): Get the exact spreadsheet formula you need, and understand it.</li><li>Turn expenses into insights (10 min): Turn a messy list of expenses into clear insights and savings.</li><li>Send a firm, polite payment reminder (5 min): Chase an overdue payment without damaging the relationship.</li></ul>
<h3>Managers and everyday office</h3><p>Meetings, updates, SOPs and messages</p><ul><li>Turn messy meeting notes into an action plan (5 min): Go from scribbled notes to a clear action table and follow-up email in five minutes.</li><li>Write your weekly status report (5 min): Turn bullet notes into a crisp weekly update your boss will actually read.</li><li>Write an SOP or checklist (10 min): Turn &#x27;how we do it&#x27; in your head into a clear SOP anyone can follow.</li><li>Write a message that gets results (10 min): Turn messy notes into a clear, polite message in your own voice, in under ten minutes.</li></ul>
<h3>Founders and small business</h3><p>Customers, pricing, plans and listings</p><ul><li>Reply to customer reviews (10 min): Reply to good and bad reviews warmly, fast and on-brand.</li><li>Price your product (15 min): Work out a sensible price using costs, competitors and value.</li><li>Write a one-page business plan (15 min): Get your business idea onto one clear page you can share with a partner or investor.</li></ul>
<h3>Teachers and trainers</h3><p>Lessons, quizzes and parent messages</p><ul><li>Plan a lesson in 10 minutes (10 min): Plan an engaging lesson with activities and a quick check for understanding.</li><li>Make a quiz from any chapter (5 min): Turn any chapter or notes into a fun quiz with an answer key.</li></ul>
<h2>In my life</h2><p>Save money, time and stress on everyday things.</p>
<h3>Travel</h3><p>Flights, cabs, itineraries and packing</p><ul><li>Find the cheapest flights (15 min): Use AI to plan a smart flight search, then compare the real total cost of your options.</li><li>Book a taxi smartly (5 min): Choose the best way to get somewhere: cheapest, fastest or safest, and book it confidently.</li><li>Plan a trip itinerary (15 min): Plan a relaxed, realistic trip that fits your budget and your people.</li><li>Never forget anything: packing list (5 min): A packing list tailored to your trip, weather and people.</li></ul>
<h3>Money and shopping</h3><p>Deals, budgets and scams</p><ul><li>Build your AI shopping assistant (25 to 35 min): Build an assistant that compares options against your needs, spots fake discounts and helps you decide, without the regret.</li><li>Can AI expose fake discounts? (10 min): Use AI and real evidence to tell a genuine deal from an inflated one in five minutes.</li><li>Make a monthly budget (10 min): See where your money goes and find realistic savings, without guilt.</li><li>Check if a message is a scam (3 min): Spot scams in messages, calls and too-good-to-be-true offers.</li><li>Which AI subscriptions are worth paying for? (15 min): Decide which AI subscriptions, if any, are worth your money, based on what you actually do.</li></ul>
<h3>Home and family</h3><p>Meals, homework, celebrations and complaints</p><ul><li>Plan a week of meals and groceries (10 min): A week of easy meals and one grocery list, in ten minutes.</li><li>Help with homework without giving answers (5 min): Help your child understand, not just copy.</li><li>Plan a festive dinner with AI (20 min): Plan a stress-free dinner for family or friends: menu, budget, shopping list and a cooking timeline.</li><li>Write a complaint that gets action (10 min): Complain to a company, landlord or society clearly and firmly.</li></ul>
<h3>Learning and career</h3><p>Prompting, new skills and interviews</p><ul><li>Write your first great prompt (5 min): Turn a vague request into a prompt that gets a genuinely useful answer, and see the difference side by side.</li><li>Give AI a role (15 to 20 min): Stop prompting badly. Give AI a role, and build five specialist assistants you will reuse every week, in about 15 minutes.</li><li>Check what AI tells you (10 min): Learn to separate fluent from factual: find the claims worth checking and verify them in minutes.</li><li>Learn any new skill in 14 days (10 min): A realistic 14-day plan to learn the basics of anything, 20 minutes a day.</li><li>Prepare for a job interview (15 min): Practise with AI as your interviewer and get feedback on your answers.</li></ul>
<h3>Health and wellbeing</h3><p>Prepare, understand and ask better questions</p><ul><li>Prepare for a doctor&#x27;s visit (5 min): Go in prepared: understand terms and know what to ask. Not medical advice.</li></ul>
<h3>Celebrations and creative</h3><p>Invites, videos, posters and speeches</p><ul><li>Create your first AI poster (10 min): Describe an occasion and watch AI design a poster for it, then get prompts for photo-real versions.</li><li>Create your first AI video (10 to 15 min): Go from a topic to a narrated 15-second vertical video, written and rendered by AI, in ten minutes.</li><li>Write a toast or speech (10 min): Write a warm, funny, personal toast for a wedding, birthday or farewell.</li></ul>
<h2>Prompt Master: a 20-step prompt course</h2><ol><li>Just ask, then notice: See why vague questions get vague answers</li><li>Lead with the goal: Start with an action verb and the thing you want</li><li>Add context: Tell AI who you are and what&#x27;s going on</li><li>Set the rules: Add limits, must-haves and must-nots</li><li>Shape the answer: Ask for the format you actually want</li><li>Give AI a role: Assign an expert role and an audience</li><li>Show an example: Give one example of what good looks like</li><li>Talk back: Improve an answer with follow-ups</li><li>Let AI interview you: Ask AI to ask you questions first</li><li>Ask for options: Get variations, then choose with criteria</li><li>Break it into steps: Chain prompts: plan first, then build</li><li>Ask it to think out loud: Request reasoning, assumptions and unknowns</li><li>Control tone and voice: Name the tone, the reader and what to avoid</li><li>Fence off your content: Use quotes or tags around pasted text</li><li>Make AI check itself: Ask for a self-review and an improved version</li><li>Keep it honest: Ask for sources and &#x27;I don&#x27;t know&#x27;</li><li>Prompt a picture: Use the five visual ingredients</li><li>Make it reusable: Turn a great prompt into a template</li><li>Set standing instructions: Write your custom instructions</li><li>Master challenge: the Prompt Doctor: Fix a broken prompt using everything you&#x27;ve learned</li></ol>
<h2>Questions people ask</h2><h3>What is Learn by doing?</h3><p>Learn by doing is free, hands-on AI practice by Kunal Mukherjee. Instead of watching lessons, you pick a real task from your work or your life and do it with any AI assistant, step by step. It has three parts: 45 guided tasks, Prompt Guru for everyday prompts, and Prompt Master, a 20-step prompt course.</p><h3>Is Learn by doing free?</h3><p>Yes. The tasks, Prompt Guru and the Prompt Master course are free.</p><h3>Which AI assistant do I need?</h3><p>Any AI assistant you already use. Each task gives you the prompt to copy, tells you what to check, and shows where a person still needs to decide.</p><h3>Who is it for?</h3><p>People at work (marketing, sales, HR, finance, managers, founders, teachers) and anyone who wants help with everyday life: travel, money, home, learning, health and celebrations.</p><h3>Who made it?</h3><p>Kunal Mukherjee, a Human + AI Strategist based in Mumbai, India, who also writes the What the AI!? newsletter.</p>

function md(t){let h=esc(t),out=[],L=h.split('\n'),i=0;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  while(i<L.length){let l=L[i];if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;out.push('<pre class="mdpre">'+b.join('\n')+'</pre>');continue}
    if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);rows=rows.filter(r=>!/^\|[\s:|-]+\|?$/.test(r));out.push('<div class="mdt"><table>'+rows.map((r,k)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>k?'<td>'+inl(c.trim())+'</td>':'<th>'+inl(c.trim())+'</th>').join('')+'</tr>').join('')+'</table></div>');continue}
    let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push('<h4>'+inl(m[2])+'</h4>');i++;continue}

function guideHTML(p){const v=vals(),f=s=>esc(fill(s,v));return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${esc(p.title)}</title><style>body{font:var(--fs-base)/1.6 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 24px;color:#17201C}h1{font-size:var(--fs-xl)}h2{border-bottom:3px solid #CDEBD9;padding-bottom:4px;margin-top:32px}pre{background:#111;color:#eee;padding:14px;border-radius:6px;white-space:pre-wrap}.h{background:#fff8db;padding:10px 14px;border-radius:6px}</style></head><body><p><b>WHAT THE AI!? · ${esc(p.code)}</b></p><h1>${esc(p.title)}</h1><p>${esc(p.promise)}</p><p><b>What you'll make:</b> ${esc(p.makes)}</p>${p.steps.map((s,i)=>`<h2>Step ${i+1}. ${esc(s.t)}</h2><p>${f(s.d)}</p><p class="h"><b>Your job:</b> ${esc(s.human)}</p>${s.prompt?`<pre>${f(s.prompt)}</pre>`:''}<ul>${s.check.map(c=>`<li>☐ ${esc(c)}</li>`).join('')}</ul>${s.stuck?`<p><i>Stuck? ${esc(s.stuck)}</i></p>`:''}`).join('')}<h2>The Human Line</h2><p><b>AI is good at:</b> ${esc(p.humanline.ai)}<br><b>You own:</b> ${esc(p.humanline.you)}<br><b>Watch out:</b> ${esc(p.humanline.fails)}</p><p>Learn by doing at WHAT THE AI!? · See it. Learn it. Make it. With AI.</p></body></html>`}

// ---------- fun ----------
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.classList.add('out'),1800);setTimeout(()=>d.remove(),2300)}
function burst(el,n){if(RM||!el)return;const cv=$('#fx'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['#CDEBD9','#17201C','#C6DCE8','#EBCBBE','#CADDB6'],ps=Array.from({length:n},()=>({x:cx,y:cy,vx:(Math.random()-.5)*12,vy:-Math.random()*12-3,s:4+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6,life:1}));
  const f=()=>{c.clearRect(0,0,cv.width,cv.height);let alive=0;ps.forEach(p=>{if(p.life<=0)return;alive++;p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.life-=.016;p.r+=.2;c.save();c.globalAlpha=Math.max(0,p.life);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore()});if(alive)requestAnimationFrame(f);else c.clearRect(0,0,cv.width,cv.height)};f()}

// ---------- PROMPT GURU ----------
const GT=GURU.T,GC=GURU.C,GE=GURU.E;
const LBL={email:'Email',msg:'Message',post:'Social post',explain:'Explain',plan:'Plan',ideas:'Ideas for',compare:'Compare',summ:'Summarise',edit:'Improve',doc:'Write',list:'Checklist for',learn:'Learn',analyze:'Analyse',reply:'Reply',script:'Script for',image:'Image of',howto:'How to',find:'Find',decide:'Should I',recipe:'Recipe for',translate:'Translate'};
const ROLE={email:'a clear, professional communicator',msg:'a friendly, clear writer',post:'a social media copywriter',explain:'a patient teacher who uses everyday examples',plan:'an experienced planner',ideas:'a creative strategist',compare:'an independent advisor with no brand bias',summ:'a sharp editor',edit:'a careful editor who keeps my voice',doc:'an expert writer in this field',list:'an organised project manager',learn:'a patient tutor who quizzes me',analyze:'a careful data analyst',reply:'a calm, empathetic communicator',script:'a short-video scriptwriter',image:'',howto:'an expert who explains for beginners',find:'a careful researcher',decide:'a thoughtful, honest advisor',recipe:'a home cook who keeps it simple',translate:'a native-speaker translator'};
const PMSTEP={email:13,msg:13,reply:13,post:7,explain:3,howto:3,plan:4,recipe:4,ideas:10,compare:12,decide:12,summ:14,edit:14,translate:14,analyze:14,doc:5,list:5,learn:9,script:11,image:17,find:16};
const PASTE=['summ','edit','analyze','translate'];
const gTitle=e=>{const t=e[2],x=e[0];return t==='decide'?`Should I ${x}?`:`${LBL[t]} ${x}`.replace(/^(\w)/,c=>c.toUpperCase())};
const GIDX=GE.map((e,i)=>({h:'#g-'+i,t:gTitle(e),s:'Prompt Guru · '+GC[e[1]][1],k:(gTitle(e)+' '+GC[e[1]][1]+' '+e[2]).toLowerCase(),g:1}));

function guruHome(q=''){document.title='Prompt Guru · WHAT THE AI!?';
  app.innerHTML=`<nav class="crumb"><a href="#home">Home</a><span>›</span>Prompt Guru</nav>
  <section class="ghero"><div class="guru-av big">${IC.guru}</div><div><span class="kick2"><i></i>Prompt Guru</span><h1>Don't just get a prompt.<br><span class="hl1">Learn to write it.</span></h1>
  <p>1,000+ everyday tasks people ask AI for, at work and in life. Pick one and the Guru walks you through building the prompt yourself: role, goal, context, constraints and format, with live tips as you type.</p>
  <div class="bigsearch"><span>${IC.search}</span><input id="gq" value="${esc(q)}" placeholder="Search 1,000+ prompts: “resignation email”, “Goa trip”, “explain SIP”" autocomplete="off"></div></div></section>
  <div class="gfil"><button class="gf on" data-c="-1">All</button>${['work','life'].map(d=>`<span class="gfd">${d==='work'?'At work':'In my life'}</span>`+GC.map((c,i)=>c[2]===d?`<button class="gf" data-c="${i}">${esc(c[1])} <small>${GE.filter(e=>e[1]===i).length}</small></button>`:'').join('')).join('')}</div>
  <div class="gtypes">${Object.keys(LBL).map(t=>`<button class="gt" data-t="${t}">${LBL[t]}</button>`).join('')}</div>
  <div class="glist" id="glist"></div><div class="gmore"><button class="btn" id="gm" hidden>Show more</button></div>
  <p class="note gsrc">Curated from the most common things people ask AI for. In a large study of real usage, practical guidance, seeking information and writing make up most conversations, and most writing requests are edits of people's own text, so the library leans that way.</p>`;
  let cat=-1,typ=null,lim=60;const render=()=>{const w=$('#gq').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const hits=GE.map((e,i)=>({e,i})).filter(({e,i})=>(cat<0||e[1]===cat)&&(!typ||e[2]===typ)&&w.every(z=>GIDX[i].k.includes(z)));
    $('#glist').innerHTML=hits.slice(0,lim).map(({e,i})=>`<a class="gcard" href="#g-${i}" style="--c:${PAL[e[1]%PAL.length]}"><span class="gty">${LBL[e[2]]}</span><b>${esc(gTitle(e))}</b><small>${esc(GC[e[1]][1])}</small></a>`).join('')||'<p class="note">No prompts match. Try fewer words.</p>';
    $('#gm').hidden=hits.length<=lim;$('#gm').textContent=`Show more (${hits.length-lim} left)`};
  $('#gq').oninput=()=>{lim=60;render()};$$('.gf').forEach(b=>b.onclick=()=>{cat=+b.dataset.c;$$('.gf').forEach(x=>x.classList.toggle('on',x===b));lim=60;render()});
  $$('.gt').forEach(b=>b.onclick=()=>{typ=typ===b.dataset.t?null:b.dataset.t;$$('.gt').forEach(x=>x.classList.toggle('on',x.dataset.t===typ));lim=60;render()});
  $('#gm').onclick=()=>{lim+=60;render()};if(S.gcat!=null){const b=$(`.gf[data-c="${S.gcat}"]`);S.gcat=null;if(b){b.click();return hdr()}}render();hdr();scrollTo(0,0)}

function guru(i){const e=GE[i];if(!e)return guruHome();const t=e[2],T2=GT[t],cat=GC[e[1]],title=gTitle(e),col=PAL[e[1]%PAL.length];document.title=title+' · Prompt Guru';
  const goal=T2[1].replace('{x}',e[0]);const st=S.guru&&S.guru[i]||{};const pm=PMSTEP[t];
  const related=AREAS.find(a=>a.name.toLowerCase().startsWith(cat[1].toLowerCase().split(' ')[0]));
  app.innerHTML=`<nav class="crumb"><a href="#home">Home</a><span>›</span><a href="#guru">Prompt Guru</a><span>›</span>${esc(cat[1])}</nav>
  <section class="gtop" style="--c:${col}"><div class="guru-av">${IC.guru}</div><div><span class="tcode">PROMPT GURU · ${esc(LBL[t]).toUpperCase()}</span><h1>${esc(title)}</h1><p>Don't just copy a prompt. Build it in 5 quick parts and learn why each one matters. About 2 minutes.</p></div></section>
  <div class="gwrap" style="--c:${col}"><div class="gbuild">
   <div class="gp" data-p="r"><div class="gph"><span class="gl">R</span><b>Role</b><em>optional</em></div><p class="gwhy"><span class="gs">Guru says</span>Give AI a job title. It changes the focus and the questions it considers.</p>
    <div class="gchips">${ROLE[t]?`<button class="gc${st.role!==''?' on':''}" data-role="${esc(ROLE[t])}">Act as ${esc(ROLE[t])}</button>`:'<span class="note">Image prompts don\'t need a role.</span>'}</div></div>
   <div class="gp" data-p="g"><div class="gph"><span class="gl">G</span><b>Goal</b><em>done for you</em></div><p class="gwhy"><span class="gs">Guru says</span>Start with an action and the exact thing you want back. Edit it to make it yours.</p>
    <input class="gin" id="g_goal" value="${esc(st.goal||goal)}"></div>
   <div class="gp" data-p="c"><div class="gph"><span class="gl">C</span><b>Context</b><em>the most important part</em></div><p class="gwhy"><span class="gs">Guru says</span>AI doesn't know your situation. Answer these two questions in a line each.</p>
    ${T2[2].map((q,k)=>`<label class="gq2">${esc(q)}<input class="gin" id="g_c${k}" value="${esc((st.c||[])[k]||'')}" placeholder="Type your answer"></label>`).join('')}
    ${PASTE.includes(t)?`<label class="gq2">Paste your text here<textarea class="gin" id="g_paste" rows="4" placeholder="Paste the text you want AI to work on">${esc(st.paste||'')}</textarea></label>`:''}</div>
   <div class="gp" data-p="k"><div class="gph"><span class="gl">C</span><b>Constraints</b><em>pick 2 or more</em></div><p class="gwhy"><span class="gs">Guru says</span>Rules stop AI suggesting things you can't use. Tap to add, then fill any [blanks].</p>
    <div class="gchips">${T2[3].map(c=>`<button class="gc${(st.k||[]).includes(c)?' on':''}" data-k="${esc(c)}">${esc(c)}</button>`).join('')}</div><input class="gin" id="g_kx" value="${esc(st.kx||'')}" placeholder="Add your own rule, e.g. “no nightlife”, “budget ₹5,000”"></div>
   <div class="gp" data-p="f"><div class="gph"><span class="gl">F</span><b>Format</b><em>pick one</em></div><p class="gwhy"><span class="gs">Guru says</span>Say how the answer should look, so it's ready to use.</p>
    <div class="gchips">${T2[4].map(f=>`<button class="gc${st.f===f?' on':''}" data-f="${esc(f)}">${esc(f)}</button>`).join('')}</div></div>
   <div class="gp" data-p="h"><div class="gph"><span class="gl">✓</span><b>Honesty</b><em>pro move</em></div><p class="gwhy"><span class="gs">Guru says</span>${esc(T2[5])}</p>
    <div class="gchips"><button class="gc${st.ask!==false?' on':''}" data-h="ask">Ask me if anything is missing</button><button class="gc${st.hon!==false?' on':''}" data-h="hon">Don't invent facts; mark what's uncertain</button></div></div>
  </div>
  <aside class="gside"><div class="gcard2"><div class="gsh"><b>Your prompt</b><span class="gscore" id="gsc"></span></div><div class="gmeter"><i id="gmi"></i></div>
   <div class="gprev" id="gprev"></div><div class="gtips" id="gtips"></div><div class="glive" id="glive" hidden></div>
   <div class="gbtns"><button class="btn" id="gcopy">${IC.copy} Copy</button><button class="btn" id="grev">${IC.spark} Guru review</button><button class="btn pri" id="grun">Run it <span>→</span></button></div>
   <div id="gout"></div>
   <div class="glearn"><b>What you just practised</b><p>Role + Goal + Context + Constraints + Format, the same recipe that works for any task.</p>${pm?`<a href="#step-${pm}">Go deeper: Prompt Master step ${pm} →</a>`:''}${related?`<a href="#${related.door}-${related.id}">Do a hands-on ${esc(related.name)} task →</a>`:''}</div></div></aside></div>`;
  const val=id=>{const x=$('#'+id);return x?x.value.trim():''};
  const state=()=>({role:$('[data-role].on')?$('[data-role]').dataset.role:(ROLE[t]?'':null),goal:val('g_goal'),c:T2[2].map((_,k)=>val('g_c'+k)),paste:val('g_paste'),k:$$('[data-k].on').map(b=>b.dataset.k),kx:val('g_kx'),f:($('[data-f].on')||{}).dataset?.f||'',ask:!!$('[data-h="ask"].on'),hon:!!$('[data-h="hon"].on')});
  const build=s=>{const parts=[];if(s.role)parts.push(['r','Act as '+s.role+'.']);parts.push(['g',s.goal]);const cx=s.c.filter(Boolean).map(x=>x.replace(/[.\s]+$/,'')+'.').join(' ');if(cx)parts.push(['c','Context: '+cx]);
    const ks=[...s.k,...(s.kx?[s.kx]:[])];if(ks.length)parts.push(['k','Constraints: '+ks.join('; ')+'.']);if(s.f)parts.push(['f','Format: '+s.f+'.']);
    const hs=[s.ask?'If anything essential is missing, ask me first.':'',s.hon?"Don't invent facts, prices or names; mark anything you're unsure about.":''].filter(Boolean).join(' ');if(hs)parts.push(['h',hs]);
    if(PASTE.includes(t))parts.push(['p','Text:\n"""\n'+(s.paste||'[paste your text here]')+'\n"""']);return parts};
  const score=s=>{const tips=[];let n=10;
    if(s.role)n+=10;else if(ROLE[t])tips.push(['Add a role','r']);
    const ca=s.c.filter(x=>x.split(/\s+/).filter(Boolean).length>=4).length;n+=ca*15;if(ca<s.c.length)tips.push([ca?'Answer the second context question too':'Answer the two context questions','c']);
    const kc=s.k.length+(s.kx?1:0);if(kc>=2)n+=20;else if(kc===1){n+=10;tips.push(['Add one more constraint','k'])}else tips.push(['Pick at least 2 constraints','k']);
    if(s.f)n+=15;else tips.push(['Choose a format','f']);if(s.ask||s.hon)n+=15;else tips.push(['Add an honesty rule','h']);
    const txt=build(s).map(p=>p[1]).join(' ');if(/\[(?!paste)[^\]]+\]/.test(txt)){n-=10;tips.unshift(['Fill in the [blanks] in your prompt','k'])}if(PASTE.includes(t)&&!s.paste)tips.unshift(['Paste your text','c']);
    return {n:Math.max(5,Math.min(100,n)),tips}};
  const draw=()=>{const s=state();S.guru=S.guru||{};S.guru[i]=s;store();const parts=build(s),sc=score(s);
    $('#gprev').innerHTML=parts.map(([p,x])=>`<span class="pp p-${p}" title="${{r:'Role',g:'Goal',c:'Context',k:'Constraints',f:'Format',h:'Honesty',p:'Your text'}[p]}">${esc(x)}</span>`).join(' ');
    $('#gsc').textContent=sc.n>=90?'Guru level':sc.n>=70?'Strong':sc.n>=45?'Getting there':'Weak';$('#gsc').className='gscore s'+(sc.n>=90?4:sc.n>=70?3:sc.n>=45?2:1);
    $('#gmi').style.width=sc.n+'%';$('#gtips').innerHTML=sc.tips.slice(0,3).map(([m,p])=>`<button class="gtip" data-go="${p}">→ ${esc(m)}</button>`).join('')||'<span class="gok">Looks great. Run it, or ask for a Guru review.</span>';
    $$('.gtip').forEach(b=>b.onclick=()=>{const el=$(`.gp[data-p="${b.dataset.go}"]`);el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1200);const f=el.querySelector('input,textarea');if(f)f.focus()});
    return {s,parts,text:parts.map(p=>p[1]).join('\n')}};
  $$('.gbuild .gc').forEach(b=>b.onclick=()=>{if(b.dataset.f){$$('[data-f]').forEach(x=>x!==b&&x.classList.remove('on'))}b.classList.toggle('on');const r=draw();
    const blank=/\[(?!paste)[^\]]+\]/.exec(r.text);if(b.dataset.k&&b.classList.contains('on')&&/\[/.test(b.dataset.k)){toast('Fill in the [blank] in “Add your own rule”');const kx=$('#g_kx');kx.value=b.dataset.k;b.classList.remove('on');draw();kx.focus();const a=kx.value.indexOf('[');kx.setSelectionRange(a,kx.value.indexOf(']')+1)}live()});
  $$('.gbuild .gin').forEach(x=>x.addEventListener('input',()=>{draw();live()}));
  $('#gcopy').onclick=e=>{copy(draw().text);e.currentTarget.innerHTML=IC.copy+' Copied!';setTimeout(()=>e.currentTarget.innerHTML=IC.copy+' Copy',1300)};
  $('#grun').onclick=async()=>{const {text}=draw(),O=$('#gout');if(!AI){O.innerHTML=`<p class="note">Copy the prompt into any AI assistant (ChatGPT, Gemini, Claude or Copilot) and run it there.</p>`;return}
    O.innerHTML=`<div class="aiw"><div class="aih"><span class="aib">AI</span><span class="aist">Running your prompt<i class="dots3"><b></b><b></b><b></b></i></span></div><div class="aio" id="gans"></div></div>`;
    try{const el=$('#gans');const r=await AI(text,{modelTier:'default',cache:false,onText:({text})=>{el.innerHTML=md(text||'')}});el.innerHTML=md(r.text);addCopy(el,r.text);$('.aist',O).textContent='Done';$('.aiw',O).classList.add('fin');addXP(10,$('#grun'))}catch(err){O.innerHTML='<p class="err">Something went wrong. Try again.</p>'}};
  $('#grev').onclick=async()=>{const {text}=draw(),O=$('#gout');if(!AI){O.innerHTML='<p class="note">Paste your prompt into any AI assistant and ask it to review the prompt and say what is missing.</p>';return}
    O.innerHTML='<div class="grade2"><div class="gh2"><span class="aib">G</span>The Guru is reviewing<i class="dots3"><b></b><b></b><b></b></i></div></div>';
    try{const g=await AI.json(`You are the Prompt Guru, a warm, honest teacher of prompt writing for beginners. Task: "${title}". Review this prompt:\n"""${text}"""\nScore 0 to 10 for how well it would get a useful answer. Return JSON only: {"score":number,"praise":string (one warm sentence),"lesson":string (the single most important thing to learn from this, max 25 words),"fix":string (one specific improvement),"better":string (an improved version keeping their details, under 110 words)}`,{modelTier:'default',cache:false});
      O.innerHTML=`<div class="grade2"><div class="gtop2"><div class="ring2" style="--p:${(+g.score||0)*10}"><b>${+g.score||0}</b><span>/10</span></div><div><p><b>${esc(g.praise||'')}</b></p><p class="glesson"><span>Lesson</span>${esc(g.lesson||'')}</p></div></div><div class="lvl2"><b>Level up:</b> ${esc(g.fix||'')}</div>${g.better?`<div class="better"><span class="tcode">THE GURU'S VERSION</span><pre>${esc(g.better)}</pre><button class="cpy" id="gbc">Copy</button></div>`:''}</div>`;
      const bc=$('#gbc');if(bc)bc.onclick=()=>{copy(g.better);bc.textContent='Copied!'};addXP(5,$('#grev'))}catch(err){O.innerHTML='<p class="err">The Guru is busy. Try again in a moment.</p>'}};
  let lt=null,last='',lastAt=0,ctl=null;
  const live=()=>{clearTimeout(lt);lt=setTimeout(async()=>{if(!AI)return;const {s,text}=draw();const cw=s.c.join(' ').split(/\s+/).filter(Boolean).length;if(cw<4||text===last)return;const now=Date.now();if(now-lastAt<6000){live();return}
    last=text;lastAt=now;if(ctl)ctl.abort();ctl=new AbortController();const L=$('#glive');L.hidden=false;L.innerHTML='<span class="aib">G</span> Guru is reading<i class="dots3"><b></b><b></b><b></b></i>';
    try{const r=await AI.json(`You are the Prompt Guru giving live tips while a beginner builds a prompt for "${title}". Current prompt:\n"""${text}"""\nReturn JSON only: {"hint":string (max 14 words, warm, the most useful next improvement),"add":[{"part":"context"|"constraint","text":string (max 12 words, use [blanks] for facts only they know),"why":string (max 6 words)}] (0 to 3 items)}`,{modelTier:'quick',cache:false,signal:ctl.signal});
      if(draw().text!==text)return;L.innerHTML=`<div class="glh"><span class="aib">G</span><b>Guru tip:</b> ${esc(r.hint||'')}</div>`+(r.add||[]).slice(0,3).map((a,k)=>`<button class="gadd" data-k="${k}">+ ${esc(a.text)} <em>${esc(a.why||'')}</em></button>`).join('');
      $$('.gadd',L).forEach(b=>b.onclick=()=>{const a=r.add[+b.dataset.k];if(a.part==='constraint'){const kx=$('#g_kx');kx.value=(kx.value?kx.value+'; ':'')+a.text}else{const c1=$('#g_c1')||$('#g_c0');c1.value=(c1.value?c1.value.replace(/[.\s]+$/,'')+'. ':'')+a.text}draw();b.remove();const f=$$('.gin').find(x=>/\[/.test(x.value));if(f){f.focus();const p=f.value.indexOf('[');f.setSelectionRange(p,f.value.indexOf(']',p)+1)}})}
    catch(err){if(err&&err.name!=='AbortError')L.hidden=true}},1800)};
  draw();hdr();scrollTo(0,0)}

// ---------- routing ----------
function route(){const h=location.hash.slice(1);if(h==='pm'||/^step-\d+$/.test(h))return;closeModal();$$('.sres').forEach(r=>r.classList.remove('on'));
  if(h.startsWith('task-')&&TP(h.slice(5)))return openTask(h.slice(5));if(h==='guru'){const q=S.gq||'';S.gq='';return guruHome(q)}const gm=h.match(/^g-(\d+)$/);if(gm)return guru(+gm[1]);if(TREE[h])return door(h);const a=AREAS.find(x=>h===x.door+'-'+x.id);if(a)return area(a);if(TP(h))return openTask(h);home()}
document.addEventListener('click',e=>{const gc=e.target.closest('[data-gc]');if(gc){S.gcat=+gc.dataset.gc}const c=e.target.closest('[data-area]');if(c&&c.dataset.area){S.lastArea=c.dataset.area;store()}});addEventListener('hashchange',route);hdr();route();
}
</script>
<script>const PC={"S": [{"t": "Just ask, then notice", "skill": "See why vague questions get vague answers", "tier": 1, "idea": "AI answers exactly what you type and guesses everything else. A vague question forces it to guess, so you get a generic answer. Add even one or two real details and the answer starts fitting your life.", "formula": "Vague in, vague out.", "bad": "Tell me about healthy food.", "good": "Give me 5 healthy vegetarian breakfasts I can make in 10 minutes before work.", "why": "The good prompt says what kind of food, how many, and the real limit: 10 minutes.", "ab": ["Help me with my resume.", "Rewrite my resume summary in 3 lines for a marketing manager role.", 1, "B names the exact part, the length and the target role."], "scenario": "You want ideas for this weekend.", "task": "Write a prompt for weekend plans that includes at least two real details about you.", "rubric": ["Includes at least two specific details (who, where, budget, interests)", "Clear about what is wanted"], "n": 1, "live": ["details2", "want"]}, {"t": "Lead with the goal", "skill": "Start with an action verb and the thing you want", "tier": 1, "idea": "Start your prompt with a clear action (write, plan, compare, explain, list) and name the exact thing you want back. AI works best when the first line tells it the job.", "formula": "Verb + deliverable + size.", "bad": "Diwali.", "good": "Write a 50-word Diwali greeting for my team to post on Slack.", "why": "It says the action (write), the deliverable (greeting), the size (50 words) and where it will be used.", "ab": ["Write a 2-line Instagram bio for a cosy café that serves filter coffee.", "Café Instagram.", 0, "A has a verb, a deliverable and a size."], "scenario": "Your friend's new café needs an Instagram bio.", "task": "Write a prompt that starts with a clear action and names exactly what you want back.", "rubric": ["Starts with a clear action verb", "Names the deliverable", "Gives a size or length"], "n": 2, "live": ["verb", "deliverable", "size"]}, {"t": "Add context", "skill": "Tell AI who you are and what's going on", "tier": 1, "idea": "AI doesn't know you. Context is everything a smart stranger would need to help: who you are, who it's for and the situation. Two sentences of context can transform an answer.", "formula": "Who I am + who it's for + what's happening.", "bad": "Explain mutual funds.", "good": "I'm 28, just started earning and have never invested. Explain mutual funds simply so I can decide whether to start a small monthly investment.", "why": "The answer can now match a beginner's level and focus on the real decision.", "ab": ["Write a leave request.", "I need two days off next week for my cousin's wedding in Jaipur. My manager is formal. Write a short leave request.", 1, "B gives the reason, timing and the manager's style."], "scenario": "You need to ask your manager for a day off for a family event.", "task": "Write a prompt that includes who you are, who it's for and the situation.", "rubric": ["Says who the writer is or their role", "Says who the message is for", "Explains the situation or reason"], "n": 3, "live": ["who", "forwhom", "situation"]}, {"t": "Set the rules", "skill": "Add limits, must-haves and must-nots", "tier": 1, "idea": "Constraints are the rules of the game: budget, time, length, must include, must avoid. They stop AI suggesting things you can't use.", "formula": "Limits + must + must not.", "bad": "Plan a dinner party.", "good": "Plan a dinner party for 8 people, budget ₹4,000, all vegetarian, no oven, ready in 2 hours.", "why": "Every rule removes a bad suggestion before it happens.", "ab": ["Plan a 3-day Goa trip for 2 under ₹30,000, no nightlife, slow mornings.", "Plan a Goa trip.", 0, "A sets budget, length and what to avoid."], "scenario": "You're planning a birthday party for a 7-year-old.", "task": "Write a prompt with at least three constraints, including one limit and one must-not.", "rubric": ["Has a limit such as budget, time or number of guests", "Has at least one must-have", "Has at least one must-not or avoid"], "n": 4, "live": ["limit", "must", "mustnot"]}, {"t": "Shape the answer", "skill": "Ask for the format you actually want", "tier": 1, "idea": "Tell AI how the answer should look: a table, a checklist, three bullet points, a day-by-day plan, under 100 words. This is the F in G-C-C-F, and with it you now have the full formula: Goal, Context, Constraints, Format.", "formula": "Goal + Context + Constraints + Format = G-C-C-F.", "bad": "Compare the iPhone and Pixel.", "good": "Compare the latest iPhone and Pixel in a table with rows for price, camera, battery and years of updates. Then give a 2-line verdict for someone who mostly takes photos of their kids.", "why": "The table makes it scannable and the verdict is tied to a real need.", "ab": ["Give me a workout plan.", "Give me a 4-week home workout plan as a table: week, days, exercises, minutes. Max 30 minutes a day, no equipment.", 1, "B defines the structure and the limits."], "scenario": "You want a weekly workout plan you'll actually follow.", "task": "Write a full G-C-C-F prompt: goal, context, constraints and a clear format.", "rubric": ["Clear goal", "Some context about the person", "At least one constraint", "Specifies the format or structure"], "n": 5, "live": ["want", "who", "limit", "format"]}, {"t": "Give AI a role", "skill": "Assign an expert role and an audience", "tier": 2, "idea": "Telling AI to act as a specific expert changes its focus, vocabulary and the questions it considers. Add who the answer is for and what kind of help you want.", "formula": "Act as [expert] + for [audience] + give me [type of help].", "bad": "Review my business idea.", "good": "Act as a sceptical investor who has seen hundreds of food startups. Review my idea for a tiffin service for office workers. List the 3 biggest risks and one way to test each cheaply.", "why": "The role brings a critical lens and the request says exactly what feedback to give.", "ab": ["Check my speech.", "Act as a warm, experienced wedding speechwriter. Review my 2-minute speech for my sister's wedding. Suggest one funnier line and flag anything that could embarrass her.", 1, "B gives a role, the audience and the specific feedback wanted."], "scenario": "You want feedback on a speech for a friend's farewell at work.", "task": "Write a prompt that gives AI a relevant role, names the audience and asks for specific feedback.", "rubric": ["Assigns a relevant expert role", "Names the audience", "Asks for a specific type of feedback"], "n": 6, "live": ["role", "forwhom", "feedback"]}, {"t": "Show an example", "skill": "Give one example of what good looks like", "tier": 2, "idea": "Describing a style is hard. Showing it is easy. Paste one example you love and say what to copy: tone, length, structure. This is called few-shot prompting.", "formula": "Here's an example + copy its [tone/length/structure] + make [number] more.", "bad": "Write captions in a fun style.", "good": "Here's a caption I love: \"Monday called. We sent cake.\" Write 5 more captions for my bakery in the same short, playful tone, under 8 words each.", "why": "AI can match a real example far better than an adjective like 'fun'.", "ab": ["Write product descriptions like this one: \"Soft as a Sunday. Our cotton tee, made to be lived in.\" Same rhythm, 3 new ones for our linen shirts.", "Write nice product descriptions.", 0, "A shows the style and says exactly what to make."], "scenario": "You run a plant shop and love this caption: \"New leaf, who dis?\"", "task": "Write a prompt that includes the example and asks for more captions in the same style.", "rubric": ["Includes the example in quotes", "Says what to copy (tone, length or structure)", "Says how many to make"], "n": 7, "live": ["example", "copywhat", "count"]}, {"t": "Talk back", "skill": "Improve an answer with follow-ups", "tier": 2, "idea": "Your first prompt is a first draft. The magic is in the follow-up: tell AI exactly what to change, and what to keep. 'Shorter, warmer, keep the second paragraph' beats starting again.", "formula": "Keep [what works] + change [specific thing] + make it [direction].", "bad": "That's not good. Try again.", "good": "Keep the opening line. Cut it to 80 words, make it warmer, and move the deadline to the first paragraph.", "why": "Specific feedback gets specific improvement.", "ab": ["Better please.", "Make the subject line more specific, remove the jargon, and end with a clear question.", 1, "B says exactly what to change."], "scenario": "AI wrote this email for you: \"Dear Sir/Madam, I am writing to formally request your esteemed consideration regarding the possibility of rescheduling our meeting, which is currently scheduled for Thursday, to a mutually convenient alternative date at your earliest convenience.\"", "task": "Write a follow-up message telling AI how to fix this draft.", "convo": ["Write an email asking my client Priya to move Thursday's meeting.", "Dear Sir/Madam, I am writing to formally request your esteemed consideration regarding the possibility of rescheduling our meeting, which is currently scheduled for Thursday, to a mutually convenient alternative date at your earliest convenience."], "rubric": ["Asks for specific changes (length, tone, wording)", "Gives a direction such as friendlier or shorter", "Keeps or adds key details (name, day, options)"], "n": 8, "live": ["change", "direction", "keydetails"]}, {"t": "Let AI interview you", "skill": "Ask AI to ask you questions first", "tier": 2, "idea": "When you're not sure what details matter, flip it: ask AI to interview you. Limit the questions and ask for one at a time so it feels like a conversation.", "formula": "Before you answer, ask me up to [N] questions, one at a time.", "bad": "Which laptop should I buy?", "good": "I want to buy a laptop. Before recommending anything, ask me up to 5 questions, one at a time, about how I'll use it and my budget. Then recommend 3 options.", "why": "AI collects what it needs instead of guessing.", "ab": ["Help me plan my wedding budget. First ask me 6 questions, one at a time, then build the budget.", "Plan my wedding budget.", 0, "A lets AI gather the details first."], "scenario": "You want help choosing a phone for your parents.", "task": "Write a prompt that asks AI to interview you before it recommends anything.", "rubric": ["Asks AI to ask questions first", "Limits the number of questions", "Asks for one question at a time or says what happens after"], "n": 9, "live": ["askq", "limitq", "oneatatime"]}, {"t": "Ask for options", "skill": "Get variations, then choose with criteria", "tier": 2, "idea": "Don't settle for one answer. Ask for several genuinely different options, the criteria to judge them, and a recommendation for your situation.", "formula": "Give me [N] different options + pros and cons + recommend one for [my situation].", "bad": "Give me a name for my business.", "good": "Give me 8 names for my home-baking business in Pune: 3 playful, 3 elegant, 2 Marathi-inspired. Rate each on memorability and domain-friendliness, then recommend one.", "why": "Different styles plus criteria make choosing easy.", "ab": ["Suggest a tagline.", "Suggest 6 taglines in 3 styles (funny, premium, emotional) and tell me which fits a budget-friendly brand best and why.", 1, "B asks for variety, criteria and a recommendation."], "scenario": "You need a name for a weekend coding club for kids.", "task": "Write a prompt that asks for several different options, how to judge them and a recommendation.", "rubric": ["Asks for multiple options", "Asks for different styles or approaches", "Asks for criteria, ratings or a recommendation"], "n": 10, "live": ["options", "styles", "criteria"]}, {"t": "Break it into steps", "skill": "Chain prompts: plan first, then build", "tier": 3, "idea": "Big tasks go wrong in one giant prompt. Ask for a plan or outline first, check it, then build one part at a time. Each step's output feeds the next.", "formula": "First give me an outline. Wait for my OK. Then write section 1.", "bad": "Write a 2,000-word blog post about remote work.", "good": "I'm writing a blog post about remote work for first-time managers. First give me 3 possible angles and an outline for the best one. Wait for my approval before writing anything.", "why": "You can steer the direction before AI writes 2,000 words in the wrong one.", "ab": ["Create my whole course on Excel.", "Outline a 6-lesson beginner Excel course. Wait for my feedback, then we'll write lesson 1 together.", 1, "B plans first and builds step by step."], "scenario": "You want a blog post about learning to swim at 40.", "task": "Write a prompt that asks for a plan or outline first and waits before writing everything.", "rubric": ["Asks for an outline, plan or angles first", "Asks AI to wait, or to do one part at a time", "Gives some context about the piece"], "n": 11, "live": ["outline", "wait", "piececontext"]}, {"t": "Ask it to think out loud", "skill": "Request reasoning, assumptions and unknowns", "tier": 3, "idea": "For decisions, ask AI to show its reasoning: the factors, the trade-offs, the assumptions it's making and what it doesn't know. You get a better answer and can spot weak spots.", "formula": "Think it through step by step + list assumptions + tell me what you'd need to know.", "bad": "Should I take the job?", "good": "Help me decide whether to take a job with 20% more pay but a 1-hour longer commute. List the factors, weigh them for a parent of a toddler, state your assumptions and tell me what information would change your answer.", "why": "You see the logic and can correct wrong assumptions.", "ab": ["Is renting or buying better? Walk through the factors for someone in Bengaluru planning to stay 5 years, show assumptions and what would change the answer.", "Rent or buy?", 0, "A asks for reasoning, assumptions and what would change it."], "scenario": "You're deciding between a ₹60,000 course now or saving for a year.", "task": "Write a prompt that asks AI to reason through the decision and show its assumptions.", "rubric": ["Asks for step-by-step reasoning or factors", "Asks for assumptions", "Asks what information is missing or would change the answer"], "n": 12, "live": ["reasoning", "assumptions", "missing"]}, {"t": "Control tone and voice", "skill": "Name the tone, the reader and what to avoid", "tier": 3, "idea": "Tone is where AI often sounds robotic. Name the tone, describe the reader, list words or styles to avoid, and if you can, paste something you wrote so it can match you.", "formula": "Tone: [x] + reader: [y] + avoid: [z] + sound like this: [sample].", "bad": "Write a message about the water cut.", "good": "Write a WhatsApp message to my housing society about water being off on Saturday 9 am to 1 pm. Tone: friendly and clear, like a helpful neighbour. Avoid formal phrases like 'kindly be informed'. Under 50 words.", "why": "Tone, reader and banned phrases steer the voice precisely.", "ab": ["Write a friendly reminder.", "Write a light, friendly reminder to my book club that we meet Sunday at 5. Avoid sounding pushy. One emoji max. Under 30 words.", 1, "B names tone, limits and what to avoid."], "scenario": "Tell your team the Friday party is moved to Monday.", "task": "Write a prompt that names the tone, the reader and at least one thing to avoid.", "rubric": ["Names the tone", "Describes the reader", "Says what to avoid", "Sets a length"], "n": 13, "live": ["tone", "forwhom", "mustnot", "size"]}, {"t": "Fence off your content", "skill": "Use quotes or tags around pasted text", "tier": 3, "idea": "When you paste text for AI to work on (a review, an email, notes), fence it off with triple quotes or tags so AI knows exactly what is instruction and what is content. Then say exactly what to do with it.", "formula": "Do [task] on the text below. Text: \"\"\" ... \"\"\"", "bad": "summarise this the delivery was late and the box was crushed but the food tasted great i want a refund for delivery", "good": "Read the customer review in triple quotes. Give me: the main complaint, the sentiment (positive, mixed or negative), and a 40-word apology reply.\nReview: \"\"\"The delivery was late and the box was crushed, but the food tasted great. I want a refund for delivery.\"\"\"", "why": "AI can't confuse your instructions with the customer's words.", "ab": ["Translate to Hindi: \"\"\"Your order has shipped and will arrive Tuesday.\"\"\"", "translate to hindi your order has shipped and will arrive tuesday thanks", 0, "A fences the content and the task is clear."], "scenario": "A customer wrote: \"Loved the kurta colour but the size chart was wrong, had to return it twice. Not happy.\"", "task": "Write a prompt that fences off this review and asks for a summary, the sentiment and a reply.", "insert": "Loved the kurta colour but the size chart was wrong, had to return it twice. Not happy.", "rubric": ["Puts the review inside quotes or tags", "Clear task on that text", "Specifies the outputs or format"], "n": 14, "live": ["fenced", "task", "format"]}, {"t": "Make AI check itself", "skill": "Ask for a self-review and an improved version", "tier": 3, "idea": "AI is often better at critiquing than at getting it right first time. Ask it to review its own answer against criteria you choose, then improve it.", "formula": "Write it + review it against [criteria] + give me the improved version.", "bad": "Write my cover letter.", "good": "Write a 150-word cover letter for a junior UX designer role. Then review it as a hiring manager: list the 3 weakest lines and rewrite the letter to fix them.", "why": "A built-in review catches clichés and weak spots before you see them.", "ab": ["Write a product launch post, then critique it as a sceptical customer and give me an improved version.", "Write a good product launch post.", 0, "A builds in a self-check."], "scenario": "You need a short LinkedIn post announcing your new job.", "task": "Write a prompt that asks AI to write the post, review it against criteria, then improve it.", "rubric": ["Asks for a first version", "Asks for a review against specific criteria", "Asks for an improved final version"], "n": 15, "live": ["firstver", "review", "improved"]}, {"t": "Keep it honest", "skill": "Ask for sources and 'I don't know'", "tier": 4, "idea": "AI can invent facts that sound real. For anything that matters, tell it: don't guess, say when you're unsure, separate facts from estimates and point me to the official source to verify.", "formula": "Don't invent + mark what you're unsure of + name the official source.", "bad": "What documents do I need for a PAN card?", "good": "What documents do I need to apply for a new PAN card in India? Separate what you're confident about from what may have changed, don't guess, and tell me which official website to verify on.", "why": "You get an honest answer and a way to check it.", "ab": ["How much is the passport fee?", "What is the current passport fee in India? If you're not sure it's current, say so and point me to the official site.", 1, "B asks for honesty and a source."], "scenario": "You want to know the rules for carrying a power bank on a domestic flight.", "task": "Write a prompt that asks for an honest answer, marks uncertainty and points to an official source.", "rubric": ["Tells AI not to guess or invent", "Asks to mark uncertainty or separate facts from estimates", "Asks for an official source to verify"], "n": 16, "live": ["noinvent", "uncertain", "source"]}, {"t": "Prompt a picture", "skill": "Use the five visual ingredients", "tier": 4, "idea": "Image prompts need a different recipe: subject, setting, style, mood and framing. Add the aspect ratio and say 'no text' (add words later in Canva, because AI often misspells them).", "formula": "Subject + setting + style + mood + framing (+ ratio, no text).", "bad": "A tea stall in the rain.", "good": "A steaming cutting-chai glass on a wooden tea-stall counter in Mumbai monsoon rain, warm cinematic photograph, cosy and nostalgic mood, close-up with blurred street lights behind, square format, empty space at the top, no text.", "why": "Every ingredient removes a guess about how it should look.", "ab": ["Diwali poster image.", "Rows of clay diyas on a marble doorstep at dusk, marigold petals, warm golden photo, festive and calm, wide shot with space on the left, 4:5 ratio, no text.", 1, "B has all five ingredients plus ratio and no text."], "scenario": "You need an image for a summer mango sale at a fruit shop.", "task": "Write an image prompt with all five ingredients, a ratio and 'no text'.", "run": false, "rubric": ["Clear subject", "Setting", "Style", "Mood", "Framing or composition", "Aspect ratio and no text"], "n": 17, "live": ["subject", "setting", "style", "mood", "framing", "ratio"]}, {"t": "Make it reusable", "skill": "Turn a great prompt into a template", "tier": 4, "idea": "When a prompt works, save it as a template. Keep the fixed instructions and put the changing parts in [square brackets]. Next time you just fill in the blanks.", "formula": "Fixed instructions + [blanks] for what changes.", "bad": "(retyping the same request every week)", "good": "Write my weekly team update. Wins: [wins]. Problems: [problems]. Next week: [plans]. Format: 3 short sections, under 120 words, friendly and direct. End with one question for the team.", "why": "Same quality every week, in seconds.", "ab": ["Write a thank-you note to [name] for [what they did]. Mention [specific detail]. Warm, under 60 words.", "Write a thank-you note to Rahul for the gift.", 0, "A is reusable for anyone, any time."], "scenario": "Every month you ask AI to summarise your household spending.", "task": "Write a reusable template prompt with [brackets] for the parts that change.", "rubric": ["Uses [brackets] for changing parts", "Keeps fixed instructions (format, tone, length)", "Would work for different months or cases"], "n": 18, "live": ["brackets", "fixed", "reusable"]}, {"t": "Set standing instructions", "skill": "Write your custom instructions", "tier": 4, "idea": "Most AI tools let you save standing instructions that apply to every chat: who you are, how you like answers, what to avoid. Write them once and every answer improves.", "formula": "About me + how to respond + always + never.", "bad": "(no custom instructions)", "good": "About me: marketing manager in Mumbai, busy, not technical. How to respond: short answers first, then detail if useful. Use Indian examples and rupees. Always flag what I should double-check. Never use jargon without explaining it.", "why": "Every future answer starts already tuned to you.", "ab": ["Be helpful.", "I'm a teacher in Kochi. Keep answers under 150 words unless I ask for more, give classroom-ready examples, and tell me when something might be outdated.", 1, "B gives real, usable standing instructions."], "scenario": "Set up your own AI assistant to suit how you work.", "task": "Write your custom instructions: about you, how AI should respond, and what it should always or never do.", "run_suffix": "\n\n(Apply the instructions above. Now answer this as a test: Suggest a quick dinner I can make tonight.)", "rubric": ["Says who you are", "Says how to respond (length, format, tone)", "Includes at least one always or never rule", "Under about 150 words"], "n": 19, "live": ["who", "howrespond", "always", "under150"]}, {"t": "Master challenge: the Prompt Doctor", "skill": "Fix a broken prompt using everything you've learned", "tier": 4, "idea": "Time to put it all together. A shop owner sent this prompt and got a terrible answer: \"write something for my shop sale make it good\". Rewrite it using everything you know: goal, context, constraints, format, a role, an example or interview, and honesty.", "formula": "G-C-C-F + role + example + honesty.", "bad": "write something for my shop sale make it good", "good": "Act as a social media copywriter for small Indian shops. Write 3 Instagram captions for a Diwali sale at my saree shop in Surat: 20% off silk sarees, 1 to 5 November. Audience: women 30 to 55 who love traditional wear. Tone warm and festive, under 40 words each, one call to action. Use only these details; don't invent other offers.", "why": "It uses role, goal, context, constraints, format and an honesty rule.", "ab": ["Make me a sale post.", "Act as a copywriter for local shops. Write 3 Instagram captions for my bakery's weekend sale (15% off cakes, Sat and Sun). Audience: families nearby. Playful, under 30 words, no invented offers.", 1, "B combines role, G-C-C-F and honesty."], "scenario": "The broken prompt: \"write something for my shop sale make it good\"", "task": "Rewrite it into a master-level prompt. Invent a realistic shop and sale details.", "rubric": ["Clear goal and deliverable", "Context about the shop and audience", "Constraints such as length or offer details", "Format", "A role or example", "An honesty rule such as don't invent offers"], "n": 20, "live": ["verb", "forwhom", "limit", "format", "role", "noinvent"]}], "T": [[1, "Beginner", "The G-C-C-F basics", "#CDEBD9"], [2, "Builder", "Roles, examples and conversation", "#D3E3EC"], [3, "Pro", "Structure, reasoning and voice", "#F1D9CF"], [4, "Master", "Honesty, templates and systems", "#D9E8C9"]]};</script>
<script>{
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STEPS=PC.S,TIERS=PC.T,RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const KEY='wta-prompt-master-v1';let S;try{S=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){S={}}S.stars=S.stars||{};S.xp=S.xp||0;S.drafts=S.drafts||{};
const store=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let AI=null,DL=null;(async()=>{try{AI=await claude.use('sample')}catch(e){}try{DL=await claude.use('downloads')}catch(e){}})();
const app=$('#app');const tc=n=>TIERS[n-1][3];
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0),doneN=()=>Object.keys(S.stars).length;
function hdr(){const s=document.getElementById('stn');if(s)s.textContent=totalStars();const x=document.getElementById('xp');if(x){let o=0;try{o=+(JSON.parse(localStorage.getItem('wta-learn-by-doing-v1'))||{}).xp||0}catch(e){}x.textContent=(+S.xp||0)+o}}
function addXP(n,el){S.xp+=n;store();hdr();const b=$('.xpb');b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
  if(el){const f=document.createElement('span');f.className='xpfly';f.textContent='+'+n+' XP';const r=el.getBoundingClientRect();f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+scrollY)+'px';document.body.append(f);setTimeout(()=>f.remove(),1200)}}
const starHTML=n=>'<span class="stars">'+[1,2,3].map(i=>`<i class="${i<=n?'on':''}">★</i>`).join('')+'</span>';

// ---------- home ----------
function home(){document.title='Prompt Master · WHAT THE AI!?';
  const next=STEPS.find(s=>!S.stars[s.n])||STEPS[19],d=doneN();
  app.innerHTML=`<section class="hero pm"><div class="hcopy"><span class="kick2"><i></i>WHAT THE AI!? · Course 1</span>
  <h1>Prompt <span class="hl1">Master</span></h1><p class="sub2">20 steps from “just asking” to writing prompts that get brilliant answers, every time.</p>
  <p>Each step takes about 3 minutes: <b>learn</b> one idea, <b>spot</b> the better prompt, then <b>do it</b>. You write a real prompt, the coach checks it, then you run it in your own AI assistant.</p>
  <div class="hcta"><a class="btn big pri" href="#step-${next.n}">${d?d===20?'Review your course':'Continue: Step '+next.n:'Start Step 1'}<span>→</span></a></div>
  <div class="pstats"><div><b>${d}</b><span>of 20 steps</span></div><div><b>${totalStars()}</b><span>of 60 stars</span></div><div><b>${S.xp}</b><span>XP</span></div></div></div>
  <div class="hart" aria-hidden="true"><div class="pcard"><div class="pc-bad"><span class="lab bad">Before</span><p>write something for my shop sale make it good</p></div><div class="arrowd">↓ 20 steps later</div><div class="pc-good"><span class="lab good">After</span><p><b>Role</b> Act as a copywriter for small shops. <b>Goal</b> Write 3 Instagram captions <b>Context</b> for my saree shop's Diwali sale <b>Rules</b> 20% off, 1 to 5 Nov, no invented offers <b>Format</b> under 40 words each.</p></div></div></div></section>
  ${TIERS.map(([t,name,desc,col])=>{const st=STEPS.filter(s=>s.tier===t),dd=st.filter(s=>S.stars[s.n]).length;return `<section class="tier" style="--c:${col}"><div class="lvh"><span class="lvn">Tier ${t}</span><h2>${name}</h2><p>${desc}</p><span class="lvp">${dd}/5 ${dd===5?'· Badge earned':''}</span></div>
  <div class="road">${st.map(s=>`<a class="node${S.stars[s.n]?' done':''}${s.n===next.n?' next':''}" href="#step-${s.n}"><span class="nn">${s.n}</span><b>${esc(s.t)}</b><small>${esc(s.skill)}</small>${S.stars[s.n]?starHTML(S.stars[s.n]):s.n===next.n?'<span class="nextb">Up next</span>':''}</a>`).join('')}</div></section>`}).join('')}

function step(n){cur=STEPS[n-1];if(!cur)return home();const s=cur,t=TIERS[s.tier-1];document.title='Step '+n+': '+s.t+' · Prompt Master';

function unlock(sel){const e=$(sel);e.classList.remove('locked');e.classList.add('open');if(!RM)e.scrollIntoView({behavior:'smooth',block:'start'})}
function wireCopy(r){$$('[data-copy]',r).forEach(b=>b.onclick=()=>{copy(b.dataset.copy);b.textContent='Copied!';setTimeout(()=>b.textContent='Copy',1200)})}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()})}
async function run(s){const mine=$('#mine').value.trim(),O=$('#out'),btn=$('#run');
  if(mine.split(/\s+/).length<3){$('#mine').classList.add('shake');setTimeout(()=>$('#mine').classList.remove('shake'),400);toast('Write a little more first.');return}
  if(!AI)return selfCheck(s,mine,O);
  btn.disabled=true;
  O.innerHTML=`${s.run===false?'':`<div class="aiw"><div class="aih"><span class="aib">AI</span><span class="aist">Running your prompt<i class="dots3"><b></b><b></b><b></b></i></span></div><div class="aio" id="ans"></div></div>`}
  <div class="grade" id="grade"><div class="gh"><span class="aib">★</span>Your coach is scoring it<i class="dots3"><b></b><b></b><b></b></i></div></div>`;
  try{
    let answer='';
    if(s.run!==false){const el=$('#ans');const input=s.convo?[{role:'user',content:s.convo[0]},{role:'assistant',content:s.convo[1]},{role:'user',content:mine}]:mine+(s.run_suffix||'');
      const r=await AI(input,{modelTier:'quick',cache:false,onText:({text})=>{el.innerHTML=md(text||'')}});answer=r.text;el.innerHTML=md(answer);$('.aist',O).textContent='Here is what your prompt produced';$('.aiw',O).classList.add('fin')}
    const g=await AI.json(`You are a friendly, honest prompt-writing coach for complete beginners. The skill being practised: "${s.t}: ${s.skill}". The idea taught: ${s.idea}
Situation given to the learner: ${s.scenario} Task: ${s.task}
Scoring criteria (each worth roughly equal marks): ${s.rubric.map((r,i)=>(i+1)+'. '+r).join(' ')}
Learner's ${s.convo?'follow-up message':'prompt'}: """${mine}"""
${answer?'The AI answer it produced (first part): """'+answer.slice(0,1200)+'"""':''}
Score 0 to 10 against the criteria, generous for real effort but honest. Return JSON only: {"score":number,"met":[booleans, one per criterion, in order],"praise":string (one warm sentence about what worked),"level_up":string (one specific improvement to make next),"better":string (an improved version of THEIR prompt, keeping their details, under 90 words)}`,{modelTier:'default',cache:false});
    showGrade(s,g);
  }catch(e){$('#grade').innerHTML=`<p class="err">${esc(e&&e.code==='rate_limited'?'The coach is busy. Wait a moment and try again.':'Something went wrong. Try again.')}</p>`;if(e&&e.code==='not_granted'){AI=null;selfCheck(s,mine,O)}}
  btn.disabled=false;btn.innerHTML='Try again <span>→</span>'}
function showGrade(s,g){const sc=Math.max(0,Math.min(10,Math.round(+g.score||0))),stars=sc>=8?3:sc>=5?2:1,met=g.met||[];
  $('#grade').innerHTML=`<div class="pgtop"><div class="ring2" style="--p:${sc*10}"><b>${sc}</b><span>/10</span></div><div>${starHTML(stars)}<p class="praise">${esc(g.praise||'')}</p></div></div>
  <ul class="rub">${s.rubric.map((r,i)=>`<li class="${met[i]?'y':'n'}">${esc(r)}</li>`).join('')}</ul>
  <div class="lvl2"><b>Level up:</b> ${esc(g.level_up||'')}</div>
  ${g.better?`<div class="better"><span class="tcode">A STRONGER VERSION OF YOUR PROMPT</span><pre>${esc(g.better)}</pre><button class="cpy" data-copy="${esc(g.better)}">Copy</button></div>`:''}
  <div class="gacts"><button class="btn" id="again">Improve mine and retry</button>${complete(s,stars)}</div>`;wireCopy($('#grade'));
  $('#again').onclick=()=>{$('#mine').focus();$('#mine').scrollIntoView({behavior:RM?'auto':'smooth',block:'center'})};wireNext(s)}
function selfCheck(s,mine,O){O.innerHTML=`<div class="grade"><div class="gh">Score yourself</div><p class="note">Copy your prompt into any AI assistant, then tick what your prompt does.</p>

 under150:{t:x=>wc(x)>=15&&wc(x)<=170,h:'Keep it 15 to 150 words',s:null},
};
function liveSetup(s,m){
  const box=document.createElement('div');box.className='live';box.innerHTML=`<div class="lrow"><div class="lchk" id="lchk"></div><div class="lmeter"><div class="lbar"><i id="lbar"></i></div><span id="lpct">0%</span></div></div><div class="chips3" id="lchips"></div><div class="lcoach" id="lcoach" hidden></div>`;
  m.insertAdjacentElement('afterend',box);
  let timer=null,lastSent='',lastAt=0,ctl=null,fixes=[];
  const local=()=>{const x=m.value,res=s.live.map(k=>DET[k]?DET[k].t(x):false),n=res.filter(Boolean).length,pct=Math.round(n/res.length*100);
    $('#lchk').innerHTML=s.rubric.map((r,i)=>`<span class="lc ${res[i]?'y':''}">${res[i]?'✓':'○'} ${esc(r)}</span>`).join('');
    $('#lbar').style.width=pct+'%';$('#lpct').textContent=pct+'%';$('#lbar').className=pct>=100?'full':'';
    $('#lchips').innerHTML=s.live.map((k,i)=>!res[i]&&DET[k]&&DET[k].s?`<button class="ch3" data-k="${k}">+ ${esc(DET[k].h)}</button>`:'').join('');
    $$('#lchips .ch3').forEach(b=>b.onclick=()=>{const d=DET[b.dataset.k];insert(m,d.s,d.start);});return res};
  const insert=(el,txt,start)=>{if(start){el.value=txt+el.value.replace(/^\s+/,'').replace(/^./,c=>c.toLowerCase())}else{el.value=el.value.replace(/\s+$/,'')+txt}
    el.dispatchEvent(new Event('input'));el.focus();const i=el.value.indexOf('[');if(i>-1){const j=el.value.indexOf(']',i);el.setSelectionRange(i,j+1)}};
  const coach=async()=>{const x=m.value.trim();if(!AI||wc(x)<5||x===lastSent)return;const now=Date.now();if(now-lastAt<4000){clearTimeout(timer);timer=setTimeout(coach,4000-(now-lastAt));return}
    lastSent=x;lastAt=now;if(ctl)ctl.abort();ctl=new AbortController();const C=$('#lcoach');C.hidden=false;C.classList.add('busy');C.querySelector('.lh')||(C.innerHTML='<div class="lh"></div><div class="lfx"></div>');C.querySelector('.lh').innerHTML='<span class="aib">AI</span> Reading your prompt<i class="dots3"><b></b><b></b><b></b></i>';
    try{const r=await AI.json(`You are a real-time prompt autocorrect for a complete beginner practising "${s.t}: ${s.skill}". Situation: ${s.scenario} Task: ${s.task} Criteria: ${s.rubric.join('; ')}.
${s.convo?'(The text is a follow-up message to fix this AI draft: '+s.convo[1]+')':''}
Their text so far: """${x}"""
Return JSON only: {"hint":string (max 14 words, warm, the single most useful next improvement, or "Looks great! Hit Run." if it meets the criteria),"fixes":[{"find":string (an EXACT substring copied from their text, max 8 words; or "" to append),"replace":string (the improved wording, max 20 words; keep their own details),"why":string (max 7 words)}] (0 to 3 fixes: fix spelling, replace vague words like "good" or "nice" with specifics, add one missing criterion)}`,{modelTier:'quick',cache:false,signal:ctl.signal});
      if(m.value.trim()!==x)return;fixes=(r.fixes||[]).filter(f=>f&&f.replace).slice(0,3);
      C.classList.remove('busy');C.querySelector('.lh').innerHTML=`<span class="aib">AI</span><b>Live coach:</b>&nbsp;${esc(r.hint||'')}`;
      C.querySelector('.lfx').innerHTML=fixes.map((f,i)=>`<div class="fx"><span class="fxt">${f.find?`<s>${esc(f.find)}</s> → `:'+ '}<ins>${esc(f.replace)}</ins><em>${esc(f.why||'')}</em></span><button class="ch3 ap" data-i="${i}">Apply</button></div>`).join('')+(fixes.length>1?'<button class="ch3 apall" id="apall">Auto-fix all</button>':'');
      $$('#lcoach .ap').forEach(b=>b.onclick=()=>{apply(fixes[+b.dataset.i]);b.closest('.fx').classList.add('used');b.textContent='Applied ✓';b.disabled=true});
      const aa=$('#apall');if(aa)aa.onclick=()=>{fixes.forEach(apply);$$('#lcoach .fx').forEach(e=>e.classList.add('used'));aa.remove()};
    }catch(e){if(e&&e.name==='AbortError')return;C.classList.remove('busy');if(e&&e.code==='rate_limited')C.querySelector('.lh').innerHTML='<span class="aib">AI</span> Coach is catching its breath. Keep typing.';else C.hidden=true}};
  const apply=f=>{if(!f)return;let v=m.value;if(f.find&&v.includes(f.find))v=v.replace(f.find,f.replace);else v=v.replace(/\s+$/,'')+' '+f.replace;m.value=v;lastSent=v.trim();m.dispatchEvent(new Event('input',{bubbles:false}));local();burstSmall(m)};
  m.addEventListener('input',()=>{local();clearTimeout(timer);timer=setTimeout(coach,1500)});
  local();if(wc(m.value)>=5)timer=setTimeout(coach,800);
}
function burstSmall(el){const r=el.getBoundingClientRect();const d=document.createElement('div');d.style.cssText=`position:fixed;left:${r.right-40}px;top:${r.top+8}px;width:1px;height:1px`;document.body.append(d);burst(d,10);setTimeout(()=>d.remove(),50)}

// ---------- helpers ----------
function md(t){let h=esc(t),out=[],L=h.split('\n'),i=0;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
  while(i<L.length){let l=L[i];if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);rows=rows.filter(r=>!/^\|[\s:|-]+\|?$/.test(r));out.push('<div class="mdt"><table>'+rows.map((r,k)=>'<tr>'+r.replace(/^\||\|$/g,'').split('|').map(c=>k?'<td>'+inl(c.trim())+'</td>':'<th>'+inl(c.trim())+'</th>').join('')+'</tr>').join('')+'</table></div>');continue}
    let m;if(m=l.match(/^(#{1,4})\s+(.*)/)){out.push('<h4>'+inl(m[2])+'</h4>');i++;continue}
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){const ol=/^\s*\d/.test(l);let it=[];while(i<L.length&&/^\s*([-*•]|\d+[.)])\s+/.test(L[i]))it.push(L[i++].replace(/^\s*([-*•]|\d+[.)])\s+/,''));out.push((ol?'<ol>':'<ul>')+it.map(x=>'<li>'+inl(x)+'</li>').join('')+(ol?'</ol>':'</ul>'));continue}
    if(!l.trim()){i++;continue}out.push('<p>'+inl(l)+'</p>');i++}return out.join('')}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.classList.add('out'),2200);setTimeout(()=>d.remove(),2700)}
function burst(el,n){if(RM||!el)return;const cv=$('#fx'),c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const cols=['#CDEBD9','#17201C','#D3E3EC','#F1D9CF','#D9E8C9'],ps=Array.from({length:n},()=>({x:cx,y:cy,vx:(Math.random()-.5)*13,vy:-Math.random()*12-3,s:5+Math.random()*6,c:cols[Math.random()*5|0],r:Math.random()*6,l:1}));
  const f=()=>{c.clearRect(0,0,cv.width,cv.height);let a=0;ps.forEach(p=>{if(p.l<=0)return;a++;p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.l-=.016;p.r+=.2;c.save();c.globalAlpha=Math.max(0,p.l);c.translate(p.x,p.y);c.rotate(p.r);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);c.restore()});if(a)requestAnimationFrame(f);else c.clearRect(0,0,cv.width,cv.height)};f()}
function route(){const h=location.hash.slice(1),m=h.match(/^step-(\d+)$/);if(h==='pm')home();else if(m)step(+m[1]);}
addEventListener('hashchange',route);hdr();route();
}
