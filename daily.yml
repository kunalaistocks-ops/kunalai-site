name: Daily update

on:
  schedule:
    - cron: "30 0 * * *"   # 6:00 AM IST every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main, master]
    paths:
      - "newsletter/**"
      - "site.config.json"
      - "data/daily.json"
      - "index.html"
      - "content.js"
      - "app.js"
      - "app-mail.js"
      - "styles.css"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install feedparser==6.0.11 markdown==3.7

      - name: Build today's edition
        run: python scripts/build.py

      - name: Save the update to the repository
        run: |
          git config user.name "kunalai-bot"
          git config user.email "actions@users.noreply.github.com"
          MSG="Daily update $(TZ=Asia/Kolkata date +%F)"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git push; then echo "Saved."; exit 0; fi
            echo "The repository changed during the build. Catching up and rebuilding (attempt $attempt)."
            sleep $((attempt * 5))
            git fetch origin "$GITHUB_REF_NAME"
            git reset --hard "origin/$GITHUB_REF_NAME"
            python scripts/build.py
            git add -A
            if git diff --cached --quiet; then echo "Already up to date."; exit 0; fi
            git commit -m "$MSG"
          done
          echo "::warning::Could not save this run's update. The site was still published, and the next run will save it."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
