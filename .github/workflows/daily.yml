name: Daily update

on:
  schedule:
    - cron: "30 0 * * *"   # 6:00 AM IST every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main, master]
    paths:
      - "newsletter/**"
      - "site.config.json"
      - "data/daily.json"
      - "index.html"
      - "content.js"
      - "app.js"
      - "styles.css"
      - "scripts/**"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install feedparser==6.0.11 markdown==3.7

      - name: Build today's edition
        run: python scripts/build.py

      - name: Save the update to the repository
        run: |
          git config user.name "kunalai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily update $(TZ=Asia/Kolkata date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

